name: P024 Windows VST3 AutoSampler verified project bank QA
on:
  push:
    branches: ['develop/**']
    paths: ['src/**','tests/**','resource/**','CMakeLists.txt','.github/workflows/windows-vst3.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: _sdk
          submodules: recursive
          fetch-depth: 1
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DBUILD_VST3=ON -DBUILD_VST3_VALIDATOR=ON -DBUILD_TESTING=ON -DVST3_SDK_ROOT="$PWD/_sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build
        run: cmake --build build-vst3 --config Release --target AutosamplerVST3 validator AutosamplerIntegration --parallel
      - name: Validate packaged VSTGUI
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle missing" }
          $resource = Get-ChildItem -Path $bundle.FullName -Recurse -File -Filter "autosampler.uidesc" | Select-Object -First 1
          if (-not $resource) { throw "Native GUI description not packaged" }
          [xml]$gui = Get-Content -LiteralPath $resource.FullName -Raw
          $tags = @($gui.'vstgui-ui-description'.'control-tags'.'control-tag')
          if ($tags.Count -ne 19) { throw "Expected 19 GUI parameter tags, got $($tags.Count)" }
          $actual = @($tags | ForEach-Object { [int]$_.tag } | Sort-Object)
          $expected = @(1000..1018)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) { throw "GUI parameter IDs differ from VST3" }
          $controls = @($gui.'vstgui-ui-description'.template.view | Where-Object { $_.'control-tag' -eq "Run" })
          if ($controls.Count -ne 1) { throw "Run button must be present" }
          $recorderResource = Get-ChildItem -Path $bundle.FullName -Recurse -File -Filter "recorder.uidesc" | Select-Object -First 1
          if (-not $recorderResource) { throw "125A Recorder status GUI resource missing" }
          [xml]$recorder = Get-Content -LiteralPath $recorderResource.FullName -Raw
          $recorderViews = @($recorder.'vstgui-ui-description'.template.view)
          if (@($recorderViews | Where-Object { $_.title -eq "RECORDER STATUS: IDLE" }).Count -ne 1) {
            throw "Recorder must display its live status placeholder"
          }
          if (@($gui.'vstgui-ui-description'.template.view | Where-Object { $_.class -eq "KeyboardView" }).Count -ne 1) {
            throw "125A GUI must contain native Steinberg KeyboardView"
          }
          Write-Host "P021 VSTGUI: 19 parameters, hardware keyboard, branded recorder status, valid packaged XML: PASS"
      - name: Official VST3 validator
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          $validator = Get-ChildItem -Path "build-vst3" -File -Filter "validator.exe" -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle not found" }
          if (-not $validator) { throw "Steinberg validator.exe not found" }
          & $validator.FullName -l $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core regression tests
        run: cmake --build build-vst3 --config Release --target autosampler_core_tests --parallel && ctest --test-dir build-vst3 -C Release --output-on-failure
        shell: bash
      - name: Actual VST3 MIDI capture and internal playback integration
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "AutoSampler VST3 bundle missing" }
          $runner = "build-vst3/Release/AutosamplerIntegration.exe"
          if (!(Test-Path $runner)) { throw "AutoSamplerIntegration test executable missing" }
          # Actual dual-VST3 integration. No fake success from standalone core fixtures.
          Write-Host "Integration: 44.1kHz, block 64, 8 takes"
          & $runner $plugin.FullName 44100 64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Integration: 48kHz, block 1024, 8 takes"
          & $runner $plugin.FullName 48000 1024
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Integration: 44.1kHz, block 512, 48-take velocity/RR matrix"
          & $runner $plugin.FullName 44100 512 matrix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "A02: two sequential projects within the same loaded DLL"
          & $runner $plugin.FullName 44100 256 sequential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "A13: real VST3 intra-block Run automation sample offsets"
          & $runner $plugin.FullName 44100 256 automation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "P009: native mid-take STOP, no partial WAV, ABORTED report while active"
          & $runner $plugin.FullName 44100 256 abort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "P010: project-restored custom folder, eight real VST3 WAVs"
          & $runner $plugin.FullName 44100 256 custom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent .125A ZIP/PCM24 compatibility
        shell: pwsh
        run: ./.github/scripts/verify125a.ps1
      # Independent host/QA source pinned to reviewed 125A Test Lab commit.
      # Technical baseline does not imply DAW, physical ASIO or release PASS.
      - name: Checkout independent 125A Plugin Test Lab
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Test-Lab
          ref: 7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c
          path: _independent_lab
          fetch-depth: 1
      - name: Build independent native Windows VST3 hosts
        shell: pwsh
        run: |
          cmake -S _independent_lab -B build-independent-lab -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Independent Test Lab configure failed" }
          cmake --build build-independent-lab --config Release --parallel 4 --target TestLabGUI TestLabHost TestLabStateStress
          if ($LASTEXITCODE -ne 0) { throw "Independent Test Lab host build failed" }
      # P74/P68 currently requires exactly ONE VST3 audio class.
      # AutoSampler deliberately exports instrument + recorder in ONE bundle.
      # Its P74 result is therefore NOT SUPPORTED, NOT a failed product check.
      # Run the Test Lab's actual dual-class-independent P22 ABI inventory
      # instead; this is an INVENTORY ONLY, not a technical/DAW/release PASS.
      - name: Independent Test Lab P22 dual-class ABI inventory
        shell: pwsh
        run: |
          $bundle = @(Get-ChildItem build-vst3/VST3/Release -Directory -Filter 'AutosamplerVST3.vst3')
          $audio = @(Get-ChildItem build-independent-lab -Recurse -File -Filter '125A_Test_Lab_Host.exe')
          if ($bundle.Count -ne 1 -or $audio.Count -ne 1) {
            throw 'P22 exact product and independent source-built host required'
          }
          New-Item -ItemType Directory -Force build-independent-evidence/p22 | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & $audio[0].FullName --inspect $bundle[0].FullName 2>&1
          $code = $LASTEXITCODE
          $output | Out-File -FilePath build-independent-evidence/p22/P22-INSPECT.txt -Encoding utf8
          if ($code -ne 0) { throw "P22 independent host failed with exit code $code" }
          $classLines = @($output | Where-Object { [string]$_ -match '^P22_CLASS\s' })
          $endLines = @($output | Where-Object { [string]$_ -match '^P22_TOTAL\s+2\s*$' })
          if ($classLines.Count -ne 2 -or $endLines.Count -ne 1) {
            throw 'P22 must independently enumerate exactly two real VST3 audio classes'
          }
          foreach ($entry in $classLines) {
            $fields = ([string]$entry) -split "\t"
            if ($fields.Count -ne 5 -or $fields[2] -ne '1' -or $fields[3] -ne '1') {
              throw 'P22 instrument/recorder component and sample32 metadata invalid'
            }
          }
          $report = @{
            schema='125a-autosampler-independent-multiclass-inventory-v1'
            status='P22_MULTICLASS_INVENTORY_PASS'
            product_source_sha='61c904093180a5b79d086f3ae78302b08ebc6ea5'
            lab_source_sha='7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c'
            plugin_sha256=(Get-FileHash -Algorithm SHA256 (Get-ChildItem $bundle[0].FullName -Recurse -File -Filter '*.vst3' | Select-Object -First 1).FullName).Hash.ToLowerInvariant()
            discovered_vst3_audio_classes=2
            p74_status='NOT_SUPPORTED_BY_PINNED_TEST_LAB_MULTICLASS_VST3'
            native_technical='NOT_RUN'
            physical_asio='NOT_RUN'
            fender_studio_pro='NOT_RUN'
            release_approved=$false
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 build-independent-evidence/p22/INDEPENDENT-INVENTORY.json
          Write-Host 'Independent Test Lab P22: two native VST3 classes inspected; P74 NOT SUPPORTED, not PASS'
      - name: Upload independent Test Lab P22 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-AutoSampler-P22-Independent-MultiClass-Inventory
          path: build-independent-evidence/p22/
          if-no-files-found: warn
      - name: Upload VST3 test binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-AutoSampler-P024-Win64
          path: build-vst3/VST3/Release/*.vst3
          if-no-files-found: error
