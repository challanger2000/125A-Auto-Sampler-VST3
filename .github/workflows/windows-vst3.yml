name: P016 Windows VST3 Normalize Headroom QA
on:
  push:
    branches: ['develop/**']
    paths: ['src/**','tests/**','resource/**','CMakeLists.txt','.github/workflows/windows-vst3.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: _sdk
          submodules: recursive
          fetch-depth: 1
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DBUILD_VST3=ON -DBUILD_VST3_VALIDATOR=ON -DBUILD_TESTING=ON -DVST3_SDK_ROOT="$PWD/_sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build
        run: cmake --build build-vst3 --config Release --target AutosamplerVST3 validator AutosamplerIntegration --parallel
      - name: Validate packaged VSTGUI
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle missing" }
          $resource = Get-ChildItem -Path $bundle.FullName -Recurse -File -Filter "autosampler.uidesc" | Select-Object -First 1
          if (-not $resource) { throw "Native GUI description not packaged" }
          [xml]$gui = Get-Content -LiteralPath $resource.FullName -Raw
          $tags = @($gui.'vstgui-ui-description'.'control-tags'.'control-tag')
          if ($tags.Count -ne 18) { throw "Expected 18 GUI parameter tags, got $($tags.Count)" }
          $actual = @($tags | ForEach-Object { [int]$_.tag } | Sort-Object)
          $expected = @(1000..1017)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) { throw "GUI parameter IDs differ from VST3" }
          $controls = @($gui.'vstgui-ui-description'.template.view | Where-Object { $_.'control-tag' -eq "Run" })
          if ($controls.Count -ne 1) { throw "Run button must be present" }
          Write-Host "VSTGUI XML, 18 parameter tags, Run control and bundled resource: PASS"
      - name: Official VST3 validator
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          $validator = Get-ChildItem -Path "build-vst3" -File -Filter "validator.exe" -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle not found" }
          if (-not $validator) { throw "Steinberg validator.exe not found" }
          & $validator.FullName -l $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core regression tests
        run: cmake --build build-vst3 --config Release --target autosampler_core_tests --parallel && ctest --test-dir build-vst3 -C Release --output-on-failure
        shell: bash
      - name: Actual VST3 MIDI capture and internal playback integration
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build-vst3/VST3/Release" -Directory -Filter "AutosamplerVST3.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "AutoSampler VST3 bundle missing" }
          $runner = "build-vst3/Release/AutosamplerIntegration.exe"
          if (!(Test-Path $runner)) { throw "AutoSamplerIntegration test executable missing" }
          # Actual dual-VST3 integration. No fake success from standalone core fixtures.
          Write-Host "Integration: 44.1kHz, block 64, 8 takes"
          & $runner $plugin.FullName 44100 64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Integration: 48kHz, block 1024, 8 takes"
          & $runner $plugin.FullName 48000 1024
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Integration: 44.1kHz, block 512, 48-take velocity/RR matrix"
          & $runner $plugin.FullName 44100 512 matrix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "P009: native mid-take STOP, no partial WAV, ABORTED report while active"
          & $runner $plugin.FullName 44100 256 abort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "P010: project-restored custom folder, eight real VST3 WAVs"
          & $runner $plugin.FullName 44100 256 custom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload VST3 test binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-AutoSampler-P016-Win64
          path: build-vst3/VST3/Release/*.vst3
          if-no-files-found: error
